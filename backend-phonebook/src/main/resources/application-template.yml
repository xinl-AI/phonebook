# ============================================================
# 手机通讯录系统 - 后端主配置文件
# ============================================================

server:
  port: 8080

spring:
  profiles:
    active: dev

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/phonebook?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: your_db_username
    password: your_db_password

  # Jackson JSON配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus配置
mybatis-plus:
  # XML映射文件位置
  mapper-locations: classpath:mapper/*.xml
  # 实体类包（别名搜索）
  type-aliases-package: com.phonebook.entity
  configuration:
    # 驼峰转下划线
    map-underscore-to-camel-case: true
    # SQL日志输出（开发环境可打开）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除字段
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  # 密钥（生产环境需更换为复杂字符串）
  secret: your_jwt_secret_key_change_in_production
  # Token过期时间（毫秒）：24小时
  expiration: 86400000
